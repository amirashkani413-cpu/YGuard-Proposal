name: Generate YGuard PDF and Word
on:
  push:
    paths:
      - 'proposal-fa.md'
      - 'generate_proposal.py'
      - '.github/workflows/generate-proposal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx reportlab Pillow
      - name: Generate Word and PDF
        run: python generate_proposal.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/YGuard_Club_Partnership_Proposal_FA.docx files/YGuard_Club_Partnership_Proposal_FA.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate YGuard proposal Word and PDF"
            git push
          fi
